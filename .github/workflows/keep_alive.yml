name: Keep Alive Render Service

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 https://prism-telegram-video.onrender.com/api/health)
          echo "Render Health Status: $STATUS"
